[tools]
swiftlint = "0.65.1"
swiftformat = { version = "0.64.7", no_app = true, rename_exe = "swiftformat" }
xcodegen = "2.47.0"
"pypi:graphifyy" = { version = "0.9.112", extras = "mcp" }

[tasks.test]
description = "Run all tests, including rclone against local S3 and SFTP servers, the NFS client, and Keychain"
dir = "{{ config_root }}/Packages/UnlocalFSCore"
run = "xcodebuild test -scheme UnlocalFSCore-Package -destination platform=macOS"

[tasks.xcode]
description = "Generate the Xcode project and open it"
dir = "{{ config_root }}"
run = "xcodegen generate && open UnlocalFS.xcodeproj"
