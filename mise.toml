[tools]
swiftlint = "0.65.1"
xcodegen = "2.46.0"

[tasks.app]
description = "Build the universal macOS app into dist/"
dir = "{{ config_root }}"
run = [
    "xcodegen generate --quiet",
    '''
xcodebuild build \
    -project UnlocalFS.xcodeproj \
    -scheme UnlocalFS \
    -configuration Release \
    -destination 'generic/platform=macOS' \
    -derivedDataPath .build/xcode \
    -disableAutomaticPackageResolution \
    -quiet \
    CONFIGURATION_BUILD_DIR="$PWD/dist"''',
]

[tasks.xcode]
description = "Generate the Xcode project and open it"
dir = "{{ config_root }}"
run = "xcodegen generate && open UnlocalFS.xcodeproj"
