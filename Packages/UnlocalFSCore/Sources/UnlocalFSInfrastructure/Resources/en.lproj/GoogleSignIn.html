<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>UnlocalFS</title>
<style>body{font:15px -apple-system,sans-serif;max-width:32em;margin:15vh auto;padding:0 1em;color:#1d1d1f}@media(prefers-color-scheme:dark){body{background:#1e1e1e;color:#f5f5f7}}</style>
</head>
<body>
{{ if .OK }}
<h1>You are signed in</h1>
<p>Close this tab and go back to UnlocalFS.</p>
{{ else }}
<h1>Sign-in did not finish</h1>
<p>{{ if .Description }}{{ .Description }}{{ else }}{{ .Name }}{{ end }}</p>
<p>Close this tab, go back to UnlocalFS, and try again.</p>
{{ end }}
</body>
</html>
