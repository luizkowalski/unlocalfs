name: UnlocalFS
options:
  deploymentTarget:
    macOS: "15.0"
  postGenCommand: |
    resolved="UnlocalFS.xcodeproj/project.xcworkspace/xcshareddata/swiftpm"
    mkdir -p "$resolved"
    cp Packages/UnlocalFSCore/Package.resolved "$resolved/Package.resolved"
packages:
  UnlocalFSCore:
    path: Packages/UnlocalFSCore
settings:
  base:
    ARCHS: arm64
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
targets:
  MountHelper:
    type: tool
    platform: macOS
    sources:
      - path: libexec/main.swift
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_NAME: mount
        PRODUCT_MODULE_NAME: MountHelper
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        SKIP_INSTALL: YES
  UnlocalFS:
    type: application
    platform: macOS
    sources:
      - path: UnlocalFS
      - path: packaging/THIRD_PARTY_NOTICES.txt
        buildPhase: resources
    dependencies:
      - target: MountHelper
        codeSign: true
        embed: true
        link: false
        copy:
          destination: wrapper
          subpath: Contents/Helpers
      - package: UnlocalFSCore
        product: UnlocalFSDomain
      - package: UnlocalFSCore
        product: UnlocalFSInfrastructure
      - package: UnlocalFSCore
        product: UnlocalFSPresentation
    configFiles:
      Debug: Signing.xcconfig
      Release: Signing.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.luizkowalski.unlocalfs
        INFOPLIST_FILE: UnlocalFS/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Manual
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        RCLONE_VERSION: 1.76.0
        RCLONE_SHA256_ARM64: e72dc90b70f4947a7b72b61bde4a4fbba5777b2874fb448951ffdde67ebd0ab7
    postBuildScripts:
      - name: Embed rclone
        shell: /usr/bin/swift
        basedOnDependencyAnalysis: false
        path: scripts/embed-rclone.swift
schemes:
  UnlocalFS:
    build:
      targets:
        UnlocalFS: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - package: UnlocalFSCore/UnlocalFSDomainTests
        - package: UnlocalFSCore/UnlocalFSCoreTests
        - package: UnlocalFSCore/UnlocalFSPresentationTests
    archive:
      config: Release
