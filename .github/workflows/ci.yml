name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

      - name: Cache rclone
        uses: actions/cache@v6
        with:
          path: .build/rclone
          key: rclone-${{ github.job }}-${{ hashFiles('project.yml') }}

      - name: Test
        working-directory: Packages/UnlocalFSCore
        run: >-
          xcodebuild test -scheme UnlocalFSCore-Package -destination platform=macOS
          -resultBundlePath "$RUNNER_TEMP/tests.xcresult"

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/tests.xcresult
            /tmp/uf-*/**/*.log
            ~/Library/Logs/DiagnosticReports

  build:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app
    steps:
      - uses: actions/checkout@v7

      - name: Cache rclone
        uses: actions/cache@v6
        with:
          path: .build/rclone
          key: rclone-${{ github.job }}-${{ hashFiles('project.yml') }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate --quiet

      - name: Build
        run: |
          xcodebuild build \
            -project UnlocalFS.xcodeproj \
            -scheme UnlocalFS \
            -configuration Release \
            -destination generic/platform=macOS \
            -derivedDataPath .build/xcode \
            -disableAutomaticPackageResolution \
            -quiet
