name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v7

      - name: SwiftLint
        run: |
          version="$(sed -nE 's/^swiftlint[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' mise.toml)"
          docker run --rm -v "$PWD:/work" -w /work "ghcr.io/realm/swiftlint:$version" lint --strict

  test:
    name: test (${{ matrix.os }}, Xcode ${{ matrix.xcode }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: "26.3"
          - os: macos-26
            xcode: "26.6"
    steps:
      - uses: actions/checkout@v7

      - name: Cache rclone
        uses: actions/cache@v6
        with:
          path: .build/rclone
          key: rclone-${{ runner.arch }}-${{ hashFiles('project.yml', 'scripts/fetch-rclone.sh') }}

      - name: Fetch rclone
        run: echo "TEST_RUNNER_RCLONE_BINARY=$(scripts/fetch-rclone.sh)" >> "$GITHUB_ENV"

      - name: Test
        uses: mxcl/xcodebuild@v3
        env:
          TEST_RUNNER_UNLOCALFS_TEST_KEYCHAIN: "1"
        with:
          xcode: ${{ matrix.xcode }}
          platform: macOS
          working-directory: Packages/UnlocalFSCore
          scheme: UnlocalFSCore-Package
          verbosity: xcbeautify

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.xcode }}
          if-no-files-found: ignore
          path: |
            /tmp/uf-*/**/*.log
            ~/Library/Logs/DiagnosticReports

  build:
    runs-on: macos-26
    timeout-minutes: 5
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v7

      - name: Cache rclone
        uses: actions/cache@v6
        with:
          path: .build/rclone
          key: rclone-${{ runner.arch }}-${{ hashFiles('project.yml', 'scripts/fetch-rclone.sh') }}

      - name: Build
        run: scripts/build-app.sh

      - name: Package
        run: ditto -c -k --keepParent dist/UnlocalFS.app dist/UnlocalFS.zip

      - uses: actions/upload-artifact@v7
        with:
          name: UnlocalFS
          path: dist/UnlocalFS.zip
