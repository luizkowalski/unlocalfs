name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: SwiftLint
        run: mise lint

  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Test
        run: mise test

      - name: Build
        run: mise app
