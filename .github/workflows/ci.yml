name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-for-testing:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app
    steps:
      - uses: actions/checkout@v7

      - name: Build tests
        working-directory: Packages/UnlocalFSCore
        run: >-
          xcodebuild build-for-testing -scheme UnlocalFSCore-Package -destination platform=macOS
          -derivedDataPath "$RUNNER_TEMP/build"

      - name: Bundle test runner
        run: |
          platform="$DEVELOPER_DIR/Contents/Developer/Platforms/MacOSX.platform/Developer"
          runner="$RUNNER_TEMP/build/Build/Products/Runner"
          mkdir "$runner"
          ditto "$platform/Library/Frameworks" "$runner"
          ditto "$platform/Library/PrivateFrameworks" "$runner"
          cp "$platform"/usr/lib/*.dylib "$platform/Library/Xcode/Agents/xctest" "$runner"

      - name: Archive tests
        run: tar -C "$RUNNER_TEMP/build/Build" -cf "$RUNNER_TEMP/tests.tar" Products

      - uses: actions/upload-artifact@v7
        with:
          name: tests
          path: ${{ runner.temp }}/tests.tar
          retention-days: 1

  test:
    name: test (${{ matrix.os }})
    needs: build-for-testing
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26, xcode-27]
    steps:
      - uses: actions/checkout@v7

      - name: Cache rclone
        uses: actions/cache@v6
        with:
          path: .build/rclone
          key: rclone-${{ github.job }}-${{ hashFiles('project.yml') }}

      - uses: actions/download-artifact@v8
        with:
          name: tests
          path: ${{ runner.temp }}

      - name: Extract tests
        run: tar -C "$RUNNER_TEMP" -xf "$RUNNER_TEMP/tests.tar"

      - name: Test
        working-directory: Packages/UnlocalFSCore
        run: |
          products="$RUNNER_TEMP/Products"
          status=0
          for bundle in "$products"/Debug/*.xctest; do
            DYLD_FRAMEWORK_PATH="$products/Debug:$products/Debug/PackageFrameworks:$products/Runner" \
            DYLD_LIBRARY_PATH="$products/Debug:$products/Runner" \
              "$products/Runner/xctest" "$bundle" || status=1
          done
          exit $status

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            /tmp/uf-*/**/*.log
            ~/Library/Logs/DiagnosticReports

  build:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app
    steps:
      - uses: actions/checkout@v7

      - name: Cache rclone
        uses: actions/cache@v6
        with:
          path: .build/rclone
          key: rclone-${{ github.job }}-${{ hashFiles('project.yml') }}

      - name: Install tools
        run: brew install xcodegen swiftlint

      - name: Lint
        run: swiftlint lint --strict

      - name: Generate project
        run: xcodegen generate --quiet

      - name: Build
        run: |
          xcodebuild build \
            -project UnlocalFS.xcodeproj \
            -scheme UnlocalFS \
            -configuration Release \
            -destination generic/platform=macOS \
            -derivedDataPath .build/xcode \
            -disableAutomaticPackageResolution \
            -quiet
