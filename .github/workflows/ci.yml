name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]
  pull_request:
    branches: [main]
    paths-ignore: ["docs/**", ".github/workflows/docs.yml"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            xcode: "26.3"
          - os: macos-26
            xcode: "26.6"
          - os: xcode-27
            xcode: "27.0"
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ matrix.xcode }}.app
    steps:
      - uses: actions/checkout@v7

      - name: Test
        working-directory: Packages/UnlocalFSCore
        run: xcodebuild test -scheme UnlocalFSCore-Package -destination platform=macOS -quiet

      - name: Upload logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-logs-${{ matrix.os }}
          if-no-files-found: ignore
          path: |
            /tmp/uf-*/**/*.log
            ~/Library/Logs/DiagnosticReports

  build:
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.0.app
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@2d8d4cafcbd33be2ea37d2b6f5ad595363d1f1ca # v5.1.1

      - name: Lint
        run: swiftlint lint --strict

      - name: Build
        run: mise run app
