name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4

      # - name: Lint
      #   run: mise lint
      # - name: Test
      #   run: mise test

      - name: Import signing certificate
        if: vars.SIGN_IDENTITY != ''
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Build
        env:
          SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
        run: VERSION="${TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" mise app

      - name: Notarize
        if: vars.SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/UnlocalFS.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple dist/UnlocalFS.app

      - name: Package
        run: |
          cd dist
          zip="UnlocalFS-${TAG#v}.zip"
          ditto -c -k --keepParent UnlocalFS.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/UnlocalFS-*.zip dist/UnlocalFS-*.zip.sha256 --clobber
