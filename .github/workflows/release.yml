name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v4

      - name: Lint
        run: mise lint

      - name: Test
        run: mise test

      - name: Build
        run: VERSION="${TAG#v}" BUILD_NUMBER="$GITHUB_RUN_NUMBER" mise app

      - name: Package
        run: |
          cd dist
          zip="UnlocalFS-${TAG#v}.zip"
          ditto -c -k --keepParent UnlocalFS.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$TAG" dist/UnlocalFS-*.zip dist/UnlocalFS-*.zip.sha256 --verify-tag --generate-notes
