name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    env:
      TAG: ${{ github.event.release.tag_name }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh >> "$GITHUB_PATH"

      - name: Generate project
        run: xcodegen generate --quiet

      - name: Import signing certificate
        if: vars.SIGN_IDENTITY != ''
        env:
          P12: ${{ secrets.DEVELOPER_ID_P12 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$P12_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" login.keychain-db

      - name: Build
        env:
          SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          settings=()
          if [ -n "$SIGN_IDENTITY" ]; then
            settings+=(CODE_SIGN_IDENTITY="$SIGN_IDENTITY" OTHER_CODE_SIGN_FLAGS=--timestamp)
          fi
          xcodebuild build \
            -project UnlocalFS.xcodeproj \
            -scheme UnlocalFS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath .build/xcode \
            -disableAutomaticPackageResolution \
            -quiet \
            CONFIGURATION_BUILD_DIR="$PWD/dist" \
            MARKETING_VERSION="${TAG#v}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            "${settings[@]}"
          codesign --verify --deep --strict dist/UnlocalFS.app

      - name: Notarize
        if: vars.SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          ditto -c -k --keepParent dist/UnlocalFS.app "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple dist/UnlocalFS.app

      - name: Package
        run: |
          cd dist
          zip="UnlocalFS-${TAG#v}.zip"
          ditto -c -k --keepParent UnlocalFS.app "$zip"
          shasum -a 256 "$zip" > "$zip.sha256"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" dist/UnlocalFS-*.zip dist/UnlocalFS-*.zip.sha256 --clobber

      - name: Remove signing keychain
        if: always() && vars.SIGN_IDENTITY != ''
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
