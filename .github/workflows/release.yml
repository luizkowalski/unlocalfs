name: Release

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-27
    timeout-minutes: 5
    env:
      TAG: ${{ github.event.release.tag_name }}
      DEVELOPER_DIR: /Applications/Xcode_26.6.app
      SIGN_IDENTITY: ${{ vars.SIGN_IDENTITY }}
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: scripts/install-xcodegen.sh >> "$GITHUB_PATH"

      - name: Import signing certificate
        if: vars.SIGN_IDENTITY != ''
        uses: apple-actions/import-codesign-certs@5142e029c445c10ffc7149d172e540235a065466 # v7.0.0
        with:
          p12-file-base64: ${{ secrets.DEVELOPER_ID_P12 }}
          p12-password: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}

      - name: Configure signing
        if: vars.SIGN_IDENTITY != ''
        env:
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: printf 'CODE_SIGN_IDENTITY = %s\nDEVELOPMENT_TEAM = %s\nOTHER_CODE_SIGN_FLAGS = --timestamp\n' "$SIGN_IDENTITY" "$TEAM_ID" > Signing.local.xcconfig

      - name: Build
        run: scripts/build-app.sh MARKETING_VERSION="${TAG#v}" CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Make DMG
        run: |
          mkdir "$RUNNER_TEMP/dmg"
          ditto dist/UnlocalFS.app "$RUNNER_TEMP/dmg/UnlocalFS.app"
          ln -s /Applications "$RUNNER_TEMP/dmg/Applications"
          hdiutil create -srcdir "$RUNNER_TEMP/dmg" -volname UnlocalFS -format UDZO "UnlocalFS-${TAG#v}.dmg"

      - name: Notarize
        if: vars.SIGN_IDENTITY != ''
        env:
          APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          TEAM_ID: ${{ vars.TEAM_ID }}
        run: |
          dmg="UnlocalFS-${TAG#v}.dmg"
          codesign --sign "$SIGN_IDENTITY" --timestamp "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$PASSWORD" --wait
          xcrun stapler staple "$dmg"

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" UnlocalFS-*.dmg --clobber
