version: 2
updates:
  - package-ecosystem: swift
    directory: /Packages/UnlocalFSCore
    schedule:
      interval: "daily"
      time: "18:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: "daily"
      time: "18:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3

  - package-ecosystem: npm
    directory: /docs
    schedule:
      interval: "daily"
      time: "18:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 3
